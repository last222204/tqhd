<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1014">
  <title>TQHD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏹</text></svg>">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
  <header class="top">
    <span class="brand">TQHD</span>
    <span id="fx" class="fx"><span class="sk w-fx"></span></span>
  </header>

  <main>
    <section id="banner" class="banner">
      <div id="bannerBody" class="bb">
        <div class="sk w-30"></div>
        <div class="sk w-60 tall"></div>
        <div class="sk w-50"></div>
      </div>
      <picture class="mascot" id="mascot" hidden>
        <source id="mascotWebp" type="image/webp">
        <img id="mascotImg" alt="" width="64" height="64" decoding="async">
      </picture>
    </section>

    <div id="todo" class="todo"><span class="sk w-30"></span></div>
    <p class="warn">판정은 종가 기준 · 장중은 참고</p>
    <div id="alerts"></div>

    <section id="card" class="card">
      <div class="sk w-30"></div>
      <div class="sk w-50 tall"></div>
      <div class="sk w-90"></div>
      <div class="sk w-90"></div>
      <div class="sk w-90"></div>
    </section>
    <section id="tqqq" class="card"><div class="sk w-30"></div><div class="sk w-50"></div></section>
    <section id="regime" class="card"></section>
    <section id="hist" class="card"></section>
    <section id="resolve" class="card resolve"></section>
  </main>

  <footer class="foot">
    <details id="info"><summary aria-label="자세히">ⓘ</summary><div id="infoBody"></div></details>
  </footer>

  <script src="assets/config.js?v=6"></script>
  <script src="assets/core.js?v=6"></script>
  <script src="assets/ui.js?v=6"></script>
  <script src="assets/app.js?v=6"></script>
</body>
</html>
