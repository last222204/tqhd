<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1014">
  <title>TQHD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏹</text></svg>">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
  <header class="top">
    <span class="brand">TQHD</span>
    <span id="fx" class="fx"><span class="sk w-fx"></span></span>
  </header>

  <main>
    <!-- ① 가격 -->
    <h3 class="sec">가격</h3>
    <section id="prices" class="card prices">
      <div class="sk w-30"></div>
      <div class="sk w-90 tall"></div>
    </section>

    <!-- ② 지금 상태 -->
    <h3 class="sec">지금 상태</h3>
    <section id="banner" class="banner">
      <div id="bannerBody" class="bb">
        <div class="sk w-30"></div>
        <div class="sk w-60 tall"></div>
        <div class="sk w-50"></div>
      </div>
      <picture class="mascot" id="mascot" hidden>
        <source id="mascotWebp" type="image/webp">
        <img id="mascotImg" alt="" width="64" height="64" decoding="async">
      </picture>
    </section>
    <div id="todo" class="todo"><span class="sk w-30"></span></div>
    <p class="warn">판정은 종가 기준 · 장중은 참고</p>
    <div id="alerts"></div>

    <!-- ③ 기준선 -->
    <h3 class="sec">기준선</h3>
    <section id="card" class="card">
      <div id="cardHead"><div class="sk w-30"></div><div class="sk w-60"></div></div>
      <div id="chartBox" class="chartbox">
        <div id="chartLegend" class="clegend"></div>
        <div id="chartTip" class="ctip" hidden></div>
        <div id="chartEl" class="chartel"></div>
      </div>
      <p id="chartNote" class="cnote" hidden>이평선은 QQQ 기준이라 QQQ 보기에서만</p>
      <div id="cardBoxes"></div>
      <details id="nums" class="nums"><summary>숫자로 보기</summary><div id="numsBody"></div></details>
    </section>

    <!-- ④ 흐름 -->
    <h3 class="sec">흐름</h3>
    <section id="hist" class="card"></section>
    <section id="regime" class="card"></section>

    <!-- ⑤ 휴장 갭 예상 -->
    <h3 class="sec">휴장 갭 예상 · NQ 선물</h3>
    <section id="gap" class="card gapc"></section>

    <!-- ⑥ 각오 -->
    <h3 class="sec">각오</h3>
    <section id="resolve" class="card resolve"></section>
  </main>

  <footer class="foot">
    <details id="info"><summary aria-label="자세히">ⓘ</summary><div id="infoBody"></div></details>
  </footer>

  <script src="assets/config.js?v=8"></script>
  <script src="assets/core.js?v=8"></script>
  <script src="assets/ui.js?v=8"></script>
  <script src="assets/chart.js?v=8"></script>
  <script src="assets/app.js?v=8"></script>
</body>
</html>
