# 매일 한국시간 07:00 (UTC 22:00): 시세 받기 → 검사 → data/state.json · history.csv 커밋
name: 매일 상태 갱신

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시세 받아서 state.json · history.csv 만들기
        run: python scripts/update_state.py

      - name: 검사 (통과 못 하면 커밋하지 않음)
        run: python -m pytest

      - name: 커밋
        run: |
          git config user.name "tqhd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/history.csv data/prices.csv data/chart.json
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "상태 갱신 $(jq -r .as_of data/state.json) ($(jq -r '.confirmed.state' data/state.json))"
            git push
          fi
