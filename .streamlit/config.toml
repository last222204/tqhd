[browser]
gatherUsageStats = false

[server]
# 외부(폰)에서도 열리게 한다. 이 PC 는 공인 IP 를 직접 받고 있어서
# 인터넷 누구나 볼 수 있다 (사용자 결정, 2026-11-14: 기록 전이라 공개 허용).
# ⚠ 2단계(매매 기록)부터는 비밀번호를 건다. 다시 이 PC 에서만 열려면 "localhost" 로.
address = "0.0.0.0"
port = 8501
runOnSave = true

[client]
toolbarMode = "minimal"

# 글꼴: Pretendard (사이트 전체 + 차트). 인터넷이 안 되면 시스템 글꼴로 대신 보인다.
# 밝은·어두운 화면을 따로 정의해야 휴대폰·PC 설정대로 자동 전환이 유지된다
[theme.light]
font = "Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"
headingFont = "Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"

[theme.dark]
font = "Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"
headingFont = "Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2"
weight = 700
